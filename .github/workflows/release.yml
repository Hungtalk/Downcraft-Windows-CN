name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: |
          dotnet build DownCraft.slnx -c Release --nologo
          tests/DownCraft.Tests/bin/Release/net10.0/DownCraft.Tests.exe

      # The tag must match <Version> in Directory.Build.props, otherwise the archives and the
      # binaries would report different versions.
      - name: Check tag matches the declared version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'Version not found in Directory.Build.props' }
          $version = $Matches[1].Trim()
          if ("v$version" -ne $tag) { throw "Tag $tag does not match version $version" }
          Write-Host "Releasing $version"

      - name: Build release packages
        shell: pwsh
        run: ./scripts/release.ps1

      - name: Smoke-test the packaged CLI
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/release/*-win-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath package -Force
          ./package/DownCraft/downcraft.exe version
          Get-ChildItem package/DownCraft | Select-Object Name, Length

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DownCraft ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
