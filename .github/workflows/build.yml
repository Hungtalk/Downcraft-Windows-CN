name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  managed:
    name: .NET build & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build McDownload.slnx -c Release --nologo

      # The test project is an xunit.v3 / Microsoft.Testing.Platform executable, so it runs
      # directly instead of going through `dotnet test` (which needs a named-pipe handshake
      # that some locked-down runners block).
      - name: Run unit tests
        run: tests/McDownload.Tests/bin/Release/net10.0/McDownload.Tests.exe

  native:
    name: native helper (mcdnative.dll)
    runs-on: windows-latest
    # The managed build and all tests pass without the DLL (managed fallback), so a toolchain
    # hiccup on the runner should not turn the whole workflow red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build mcdnative.dll
        shell: pwsh
        run: ./scripts/build-native.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mcdnative
          path: native/build/out/mcdnative.dll
          if-no-files-found: warn
